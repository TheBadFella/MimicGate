[project]
name = "mimicgate"
version = "9.0.1"
description = "MimicGate: a browser-backed, multi-protocol AI gateway for ChatGPT, Claude, Gemini, and MiniMax exposed through OpenAI-compatible APIs."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.141.1",
    "patchright>=1.62.1",
    "pillow>=12.3.0",
    "playwright-stealth>=2.0.3",
    "pydantic>=2.13.4",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "typer>=0.27.1",
    "uvicorn>=0.52.4",
]

[project.urls]
Homepage = "https://github.com/TheBadFella/MimicGate"
Repository = "https://github.com/TheBadFella/MimicGate"
Documentation = "https://github.com/TheBadFella/MimicGate/blob/main/docs/README.md"
Issues = "https://github.com/TheBadFella/MimicGate/issues"

[project.scripts]
mimicgate = "src.cli.app:main"
# Backwards-compatible alias retained for existing installs.
catgpt = "src.cli.app:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "langchain>=1.3.16",
    "langchain-openai>=1.6.0",
    "openai>=3.3.1",
    "requests>=2.32.0",
]

[tool.uv]
package = false
