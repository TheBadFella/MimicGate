name: Restore MimicGate images
on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      publish_latest:
        required: true
        default: false
        type: boolean
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Restore deleted MimicGate versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: python
        run: |
          import json, os, urllib.request, urllib.error
          base = 'https://api.github.com/users/TheBadFella/packages/container/'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def call(path, method='GET'):
              request = urllib.request.Request(base + path, headers=headers, method=method)
              with urllib.request.urlopen(request) as response:
                  body = response.read()
                  return json.loads(body) if body else None
          def versions(package, state):
              result = []
              page = 1
              while True:
                  rows = call(f'{package}/versions?state={state}&per_page=100&page={page}')
                  result.extend(rows)
                  if len(rows) < 100:
                      return result
                  page += 1
          deleted = versions('mimicgate', 'deleted')
          print('DELETED_COUNT', len(deleted))
          restored, failed = [], []
          for row in sorted(deleted, key=lambda row: row['created_at']):
              tags = row.get('metadata', {}).get('container', {}).get('tags', [])
              try:
                  call(f"mimicgate/versions/{row['id']}/restore", 'POST')
                  restored.append(row['id'])
                  print('RESTORED', row['id'], row['name'], json.dumps(tags))
              except urllib.error.HTTPError as error:
                  failed.append(row['id'])
                  print('RESTORE_FAILED', row['id'], error.code, json.dumps(tags), error.read().decode())
          for package in ['mimicgate', 'catgpt']:
              for row in versions(package, 'active'):
                  print('ACTIVE', package, row['id'], row['name'], json.dumps(row.get('metadata', {}).get('container', {}).get('tags', [])))
          print('SUMMARY', json.dumps({'restored': restored, 'failed': failed}))
          if failed:
              raise SystemExit(1)
